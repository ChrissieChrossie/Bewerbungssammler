name: Terraform Manual (Apply/Destroy)

on:
    workflow_dispatch:
        inputs:
            action:
                description: "Terraform-Aktion"
                required: true
                type: choice
                options:
                    - apply
                    - destroy
                default: apply

permissions:
    contents: read
    id-token: write

env:
    TF_VAR_allowed_cidr_blocks: ${{ vars.ALLOWED_CIDR_BLOCKS }}
    TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
    apply:
        name: Apply
        if: github.event.inputs.action == 'apply'
        runs-on: ubuntu-latest
        environment: production
        defaults:
            run:
                working-directory: terraform
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "latest"

            - name: Terraform Init
              run: |
                  terraform init -input=false \
                    -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                    -backend-config="key=bewerbungssammler/terraform.tfstate" \
                    -backend-config="region=${{ vars.AWS_REGION }}" \
                    -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE }}"

            - name: Terraform Apply
              run: terraform apply -auto-approve -input=false

    destroy:
        name: Destroy
        if: github.event.inputs.action == 'destroy'
        runs-on: ubuntu-latest
        environment: production
        defaults:
            run:
                working-directory: terraform
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "latest"

            - name: Terraform Init
              run: |
                  terraform init -input=false \
                    -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                    -backend-config="key=bewerbungssammler/terraform.tfstate" \
                    -backend-config="region=${{ vars.AWS_REGION }}" \
                    -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE }}"

            - name: Terraform Destroy
              run: terraform destroy -auto-approve -input=false
