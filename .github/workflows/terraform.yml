name: Terraform

on:
    pull_request:
        branches:
            - main
            - develop
        paths:
            - "terraform/**"
            - ".github/workflows/terraform.yml"
    workflow_dispatch:
        inputs:
            action:
                description: "Terraform-Aktion"
                required: true
                type: choice
                options:
                    - plan
                    - apply
                default: plan

permissions:
    contents: read
    pull-requests: write
    id-token: write

env:
    TF_VAR_allowed_cidr_blocks: ${{ vars.ALLOWED_CIDR_BLOCKS }}
    TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
    plan:
        name: Plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Debug OIDC token claims
              run: |
                  JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
                  echo "$JWT" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "latest"

            - name: Terraform Init
              run: |
                  terraform init -input=false \
                    -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                    -backend-config="key=bewerbungssammler/terraform.tfstate" \
                    -backend-config="region=${{ vars.AWS_REGION }}" \
                    -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE }}"

            - name: Terraform Format Check
              run: terraform fmt -check -recursive

            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -no-color -input=false | tee plan.txt

            - name: Terraform Plan auf PR kommentieren
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require("fs");
                      let plan = fs.readFileSync("terraform/plan.txt", "utf8");
                      if (plan.length > 60000) {
                          plan = plan.slice(0, 60000) + "\n... (gekürzt)";
                      }
                      const body = `#### Terraform Plan\n<details><summary>Ausgabe anzeigen</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
                      await github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body,
                      });

    apply:
        name: Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        runs-on: ubuntu-latest
        environment: production
        defaults:
            run:
                working-directory: terraform
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "latest"

            - name: Terraform Init
              run: |
                  terraform init -input=false \
                    -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                    -backend-config="key=bewerbungssammler/terraform.tfstate" \
                    -backend-config="region=${{ vars.AWS_REGION }}" \
                    -backend-config="dynamodb_table=${{ vars.TF_STATE_DYNAMODB_TABLE }}"

            - name: Terraform Apply
              run: terraform apply -auto-approve -input=false
