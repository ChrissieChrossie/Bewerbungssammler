# Lokale Entwicklungsumgebung: Postgres + FastAPI-Backend, ohne AWS.
# Start: docker compose up --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bewerbungssammler
      POSTGRES_USER: bewerbungssammler
      POSTGRES_PASSWORD: bewerbungssammler
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bewerbungssammler"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bewerbungssammler:bewerbungssammler@db:5432/bewerbungssammler
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
